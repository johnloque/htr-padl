# N1 — une ligne, deux appels (demi-lignes gauche et droite). Churro 3B (fine-tuning de Qwen2.5-VL-3B), GGUF communautaire Q8_0
strategy: N1
model:
  name: churro-3b-demi                    # dossier de sortie : transcripts/N1/churro-3b-demi/
  backend: ollama             # ollama | openai (vLLM, llama.cpp server…)
  id: "hf.co/mradermacher/churro-3B-GGUF:Q8_0"
  host: http://localhost:11434
  host_env: OLLAMA_HOST       # prioritaire si définie (ex. Docker -> host.docker.internal)
  timeout_s: 600
  extra:
    keep_alive: 30m
variant: demi                   # ligne : ligne complète, un appel | demi : demi-lignes gauche/droite, deux appels
prompts:
  gauche: configs/prompts/n1_gauche.fr.txt
  droite: configs/prompts/n1_droite.fr.txt
json_schema: true             # sortie JSON contrainte par le schéma (src/htr/schema.py)
rows_dir: data/rows           # crops de la segmentation
segmentation_dir: data/segmentation
image:
  max_side: 3500              # les crops de ligne font ≈ 3400×290 px (demi-ligne ≈ 1650×290) : pas de réduction
  jpeg_quality: 90
inference:                    # options passées telles quelles au backend
  temperature: 0.3
  top_k: 20
  top_p: 0.9
  repeat_penalty: 1.05
  num_ctx: 16384
  num_predict: 768           # une ligne fait ≈ 300 tokens : coupe les boucles
  seed: 42

services:
  transcribe:
    build: .
    environment:
      # Par défaut : l'Ollama installé sur le Mac (accélération Metal).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./raw:/raw:ro
      - ./transcripts:/transcripts

  # Optionnel : Ollama dans un conteneur (CPU seulement sur Mac, bien plus lent).
  # Démarrage : docker compose --profile bundled up -d ollama
  ollama:
    image: ollama/ollama
    profiles: ["bundled"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
